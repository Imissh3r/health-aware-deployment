services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  app:
    build: ./apps/sample-app
    environment: &app_environment
      APP_VERSION: ${APP_VERSION:-1.0.0}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      ERROR_EVERY_N_REQUESTS: ${ERROR_EVERY_N_REQUESTS:-0}
      RESPONSE_DELAY_MS: ${RESPONSE_DELAY_MS:-0}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

  candidate:
    profiles: [routing]
    build: ./apps/sample-app
    environment:
      <<: *app_environment
      APP_VERSION: "2.0.0"
      ERROR_EVERY_N_REQUESTS: ${CANDIDATE_ERROR_EVERY_N_REQUESTS:-0}
      RESPONSE_DELAY_MS: ${CANDIDATE_RESPONSE_DELAY_MS:-0}
      WORKLOAD_FAULT_FILE: /tmp/health-aware-workload-fault
    depends_on:
      db:
        condition: service_healthy

  nginx:
    profiles: [routing]
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - type: bind
        source: ./runtime/nginx/conf.d
        target: /etc/nginx/conf.d
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      app:
        condition: service_healthy

volumes:
  db-data:
